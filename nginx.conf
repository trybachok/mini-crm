# nginx внутри контейнера: отдаёт собранный SPA.
# HTTPS и внешний доступ — на внешнем reverse proxy.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Reverse proxy ходит к нам по HTTP/1.0 — без этих двух строк gzip не включится.
    gzip_http_version 1.0;
    gzip_proxied any;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Файлы с хешем в имени можно кешировать надолго.
    # Кеш задаём через expires, а не add_header: add_header в location
    # отменил бы заголовки безопасности, объявленные выше.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: любой адрес, которого нет на диске, обслуживает index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
